<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Snip</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body { background: #fff; }
    #main-view { padding: 1rem; color: #666; }
    #main-view button { padding: 6px 12px; margin-right: 8px; cursor: pointer; }
    #capture-view {
      display: none;
      position: fixed; inset: 0;
      cursor: crosshair;
      background: transparent;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    #capture-view.active { display: block; }
    #capture-view #overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.35);
      pointer-events: none;
    }
    #capture-view #overlay.has-selection { pointer-events: auto; }
    #capture-view #box {
      position: fixed;
      border: 2px solid #fff;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.5);
      background: transparent;
      pointer-events: none;
    }
    #capture-view #hint {
      position: fixed;
      bottom: max(12px, env(safe-area-inset-bottom));
      left: 50%; transform: translateX(-50%);
      color: #fff; text-shadow: 0 1px 2px #000;
      font: 13px system-ui; pointer-events: none;
    }
    #capture-view #error-msg {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      left: 50%; transform: translateX(-50%);
      max-width: 90%; padding: 8px 12px;
      background: rgba(0,0,0,0.85); color: #f88;
      font: 12px monospace; border-radius: 6px;
      display: none; pointer-events: none; white-space: pre-wrap;
    }
    #capture-view #selection-info {
      position: fixed;
      color: #fff; text-shadow: 0 1px 2px #000;
      font: 12px monospace;
      background: rgba(0,0,0,0.65);
      padding: 6px 10px;
      border-radius: 6px;
      pointer-events: none;
      display: none;
    }
    #capture-view #selection-info.visible { display: block; }
    /* 截图完成快门一闪：柔和闪白，快亮慢收；显示时占位并保持默认光标，避免出现 I 形输入光标 */
    #shutter-flash {
      position: fixed; inset: 0;
      background: #fff;
      pointer-events: none;
      z-index: 99999;
      opacity: 0;
      cursor: default;
    }
    #shutter-flash.run {
      pointer-events: auto;
      animation: shutter-flash 0.5s cubic-bezier(0.2, 0, 0.15, 1) forwards;
    }
    @keyframes shutter-flash {
      0% { opacity: 0; }
      12% { opacity: 0.7; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="main-view">
    <p style="margin-bottom: 8px;">Menu: Screenshot → Capture Full Screen / Capture Region</p>
    <button type="button" id="btn-fullscreen">Full Screen</button>
  </div>
  <div id="shutter-flash" aria-hidden="true"></div>
  <div id="capture-view">
    <div id="overlay"></div>
    <div id="box"></div>
    <div id="selection-info"></div>
    <div id="hint">Drag to select → Release or Enter to capture · Esc to cancel</div>
    <div id="error-msg"></div>
  </div>
  <script type="module" src="./index.js"></script>
</body>
</html>
