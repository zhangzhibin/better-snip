<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Select region</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; cursor: crosshair; background: transparent; }
    /* 避开 MBP 刘海：顶部留出 safe-area */
    body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    #overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.35);
      pointer-events: none;
    }
    #overlay.has-selection { pointer-events: auto; }
    #box {
      position: fixed;
      border: 2px solid #fff;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.5);
      background: transparent;
      pointer-events: none;
    }
    #hint { position: fixed; bottom: max(12px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); color: #fff; text-shadow: 0 1px 2px #000; font: 13px system-ui; pointer-events: none; }
    #error-msg { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); max-width: 90%; padding: 8px 12px; background: rgba(0,0,0,0.85); color: #f88; font: 12px monospace; border-radius: 6px; display: none; pointer-events: none; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div id="overlay"></div>
  <div id="box"></div>
  <div id="hint">Drag to select → Release or Enter to capture · Esc to cancel</div>
  <div id="error-msg"></div>
  <script type="module" src="./capture.js"></script>
</body>
</html>
